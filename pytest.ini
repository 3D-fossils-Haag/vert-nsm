[pytest]
# Run `pytest` from the repo root to run every suite.
testpaths =
    tests
    hierarchy/tests
# Lets tests import root-level scripts (classification_slicer, vtk_parsing_logic, ...)
# and the NSM / hierarchy packages without sys.path hacks.
pythonpath = .
addopts = -ra
markers =
    slicer: needs the 3D Slicer Python environment (slicer, tiny3d); skipped elsewhere
    slow: takes more than a few seconds; deselect with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
